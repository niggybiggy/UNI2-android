
name: Test P4G GXP Extractor

on:
  workflow_dispatch:
  push:
    paths:
      - 'games/p4g/import/p4g_gxp.h'
      - 'games/p4g/import/p4g_gxp_test.cpp'
      - 'games/p4g/tests/**'
      - '.github/workflows/test-p4g-gxp.yml'

jobs:
  test-gxp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile GXP extractor
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            games/p4g/import/p4g_gxp_test.cpp \
            -o p4g_gxp_test

      - name: Verify executable
        run: |
          test -x ./p4g_gxp_test
          echo "GXP extractor compiled successfully"

      - name: Test GXP parser
        run: |
          python3 - <<'PY'
          import struct

          def record(name, size):
              payload = (
                  b"GXP\x00" +
                  b"\x01\x04\x00\x00" +
                  struct.pack("<I", size) +
                  bytes(size - 12)
              )
              padding = (-size) % 32
              return (
                  name.encode("ascii").ljust(32, b"\x00") +
                  struct.pack("<I", size + padding) +
                  payload +
                  bytes(padding)
              )

          header = b"shader_f_header.bin\x00"
          header += bytes(40 - len(header))

          data = header
          data += record("F00000000_00000000.gxp", 285)
          data += record("F00000000_00000020.gxp", 216)

          with open("test_gxp.bin", "wb") as f:
              f.write(data)
          PY

          ./p4g_gxp_test test_gxp.bin | tee result.txt

          grep -q "Total de programas GXP: 2" result.txt
          grep -q "F00000000_00000000.gxp" result.txt
          grep -q "F00000000_00000020.gxp" result.txt

          echo "GXP parser test passed!"

      - name: Test corrupted GXP files
        run: |
          python3 - <<'PY'
          import struct

          original = bytearray(
              open("test_gxp.bin", "rb").read()
          )

          gxp_start = 40 + 36

          broken = original.copy()
          broken[gxp_start:gxp_start + 4] = b"BAD!"
          open("bad_magic.bin", "wb").write(broken)

          broken = original.copy()
          struct.pack_into(
              "<I", broken, gxp_start + 8, 9999
          )
          open("bad_size.bin", "wb").write(broken)

          open("truncated.bin", "wb").write(
              original[:-20]
          )
          PY

          for file in bad_magic.bin bad_size.bin truncated.bin; do
            if ./p4g_gxp_test "$file"; then
              echo "ERROR: Invalid file accepted: $file"
              exit 1
            else
              echo "Correctly rejected: $file"
            fi
          done

          echo "All corrupted GXP tests passed!"

      - name: Inspect real P4G GXP sample
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          path = Path(
              "games/p4g/tests/"
              "V00000000_00000000.gxp"
          )

          if not path.is_file():
              raise SystemExit(
                  "Real GXP sample missing. "
                  "Upload V00000000_00000000.gxp "
                  "to games/p4g/tests/"
              )

          data = path.read_bytes()

          if len(data) < 12:
              raise SystemExit("GXP header truncated")

          if data[:4] != b"GXP\x00":
              raise SystemExit("Invalid GXP magic")

          version, declared_size = struct.unpack_from(
              "<II", data, 4
          )

          if declared_size != len(data):
              raise SystemExit(
                  "Declared size does not match file"
              )

          print("Real GXP header validated")
          print("File:", path)
          print("Size:", len(data))
          print("Version field:", hex(version))
          print("Header (first 96 bytes):")
          print(data[:96].hex(" "))

          Path("real-gxp-report.txt").write_text(
              f"File: {path.name}\n"
              f"Size: {len(data)} bytes\n"
              f"Version field: 0x{version:08X}\n"
              f"Header: {data[:96].hex(' ')}\n",
              encoding="utf-8"
          )
          PY

      - name: Upload real GXP report
        uses: actions/upload-artifact@v4
        with:
          name: p4g-real-gxp-report
          path: real-gxp-report.txt
          if-no-files-found: error
